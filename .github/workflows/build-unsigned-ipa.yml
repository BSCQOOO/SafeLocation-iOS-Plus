name: Build Safe Location unsigned IPA

# Public repositories can use standard GitHub-hosted runners without consuming
# the private-repository Actions minute allowance.
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/cellular-tunnel-experiment ]
    paths:
      - "SafeLocation/**"
      - "Scripts/**"
      - "Tests/**"
      - "project.yml"
      - ".github/workflows/build-unsigned-ipa.yml"
      - ".github/trigger-build"

concurrency:
  group: safelocation-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Run source checks
        run: bash ./Scripts/quality_check.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and verify unsigned IPA
        run: bash ./Scripts/build_unsigned_ipa.sh

      - name: Test persistent panel interactions
        run: bash ./Scripts/test_panel_ui.sh

      - name: Show artifact info
        id: artifact
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          report=json.loads(Path('ipa-verification.json').read_text())
          name=f"SafeLocation-unsigned-v{report['version']}-b{report['build']}-r{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'name={name}\n')
          print(json.dumps(report,indent=2))
          PYCODE

      - name: Preserve verified IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: safelocation-unsigned-r${{ github.run_number }}
        run: |
          set -euo pipefail
          test -s SafeLocation-unsigned.ipa
          test -s ipa-verification.json
          shasum -a 256 SafeLocation-unsigned.ipa | tee SafeLocation-unsigned.ipa.sha256
          gh release create "$RELEASE_TAG" \
            SafeLocation-unsigned.ipa \
            ipa-verification.json \
            SafeLocation-unsigned.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "Safe Location unsigned IPA - run $GITHUB_RUN_NUMBER" \
            --notes "Unsigned iOS IPA from feature/cellular-tunnel-experiment, source commit $GITHUB_SHA. Sign the IPA before installing on iPhone." \
            --prerelease
