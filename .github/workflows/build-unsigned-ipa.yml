name: Cleanup old Safe Location Actions artifacts
on:
  push:
    branches: [feature/cellular-tunnel-experiment]
    paths: ['.github/workflows/build-unsigned-ipa.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and independently verify preserved Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-check
          gh release download safelocation-unsigned-r37 --repo "$GITHUB_REPOSITORY" --dir release-check
          test -s release-check/SafeLocation-unsigned.ipa
          test -s release-check/ipa-verification.json
          test -s release-check/SafeLocation-unsigned.ipa.sha256
          cd release-check
          shasum -a 256 -c SafeLocation-unsigned.ipa.sha256
          python3 -c "import json; r=json.load(open('ipa-verification.json')); print('Verified report:',r)"
      - name: Remove obsolete Actions artifacts after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            test -n "$id" || continue
            echo "Deleting old artifact $id"
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
          echo 'Old Actions artifacts cleanup completed.'
